<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CalcForge Syntax Highlighting Test</title>
    <link rel="stylesheet" href="frontend/src/styles/syntax.css">
    <style>
        body {
            background-color: #0D1117;
            color: white;
            font-family: 'Roboto Mono', monospace;
            padding: 20px;
        }
        .test-container {
            border: 1px solid #333;
            padding: 20px;
            margin: 10px 0;
            background-color: #161B22;
        }
        .test-expression {
            font-size: 14px;
            line-height: 21px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>CalcForge Syntax Highlighting Test</h1>
    
    <div class="test-container">
        <h2>Numbers</h2>
        <div class="test-expression">
            <span class="syntax-number">123</span> + <span class="syntax-number">45.67</span>
        </div>
    </div>

    <div class="test-container">
        <h2>Operators</h2>
        <div class="test-expression">
            <span class="syntax-number">10</span> <span class="syntax-operator">+</span> <span class="syntax-number">20</span> <span class="syntax-operator">*</span> <span class="syntax-number">3</span>
        </div>
    </div>

    <div class="test-container">
        <h2>Functions</h2>
        <div class="test-expression">
            <span class="syntax-function">sqrt</span><span class="syntax-paren">(</span><span class="syntax-number">16</span><span class="syntax-paren">)</span> <span class="syntax-operator">+</span> <span class="syntax-function">sin</span><span class="syntax-paren">(</span><span class="syntax-number">45</span><span class="syntax-paren">)</span>
        </div>
    </div>

    <div class="test-container">
        <h2>LN Variables</h2>
        <div class="test-expression">
            <span class="syntax-ln-1">LN1</span> <span class="syntax-operator">+</span> <span class="syntax-ln-2">LN2</span> <span class="syntax-operator">*</span> <span class="syntax-ln-3">LN3</span>
        </div>
    </div>

    <div class="test-container">
        <h2>Comments</h2>
        <div class="test-expression">
            <span class="syntax-comment">::: This is a comment line</span>
        </div>
    </div>

    <div class="test-container">
        <h2>Complex Expression</h2>
        <div class="test-expression">
            <span class="syntax-function">sum</span><span class="syntax-paren">(</span><span class="syntax-ln-1">LN1</span><span class="syntax-operator">:</span><span class="syntax-ln-5">LN5</span><span class="syntax-paren">)</span> <span class="syntax-operator">+</span> <span class="syntax-function">sqrt</span><span class="syntax-paren">(</span><span class="syntax-number">100</span><span class="syntax-paren">)</span>
        </div>
    </div>

    <script>
        // Test API call
        async function testSyntaxAPI() {
            try {
                const response = await fetch('http://localhost:8000/api/syntax-highlight', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text: 'sqrt(16) + LN1 * 2' })
                });
                
                const data = await response.json();
                console.log('Syntax highlighting API response:', data);
                
                // Display the result
                const resultDiv = document.createElement('div');
                resultDiv.className = 'test-container';
                resultDiv.innerHTML = `
                    <h2>API Test Result</h2>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
                document.body.appendChild(resultDiv);
                
            } catch (error) {
                console.error('API test failed:', error);
            }
        }
        
        // Run test when page loads
        window.addEventListener('load', testSyntaxAPI);
    </script>
</body>
</html>
